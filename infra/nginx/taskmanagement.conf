# TaskManagement 用の Nginx 設定（/etc/nginx/conf.d/ に配置する）
#
# ブラウザ → Nginx(80番) ─┬─ /      → React の静的ファイル
#                          └─ /api/  → Spring Boot (127.0.0.1:8080)
#
# フロントエンドは API を /api/... の相対パスで呼ぶため、
# Nginx が同じ入口(80番)で受けて転送すれば、CORS の設定は不要になる。
server {
    # default_server: IPアドレスなど、どの名前に一致しないアクセスもこの設定で受ける
    # server_name を "_" にしない理由: Nginx 標準の設定が "_" を使っており、
    # 同名だと後から読み込まれるこちらが無視されてしまうため
    listen 80 default_server;
    server_name taskmanagement;

    root /usr/share/nginx/html;
    index index.html;

    # 画面（React）: 存在しないパスは index.html に戻す（SPA のため）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: Spring Boot に転送する
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        # $http_host: ポート番号つきの Host（例 localhost:8081）をそのまま渡す。
        # $host だとポートが抜け、ブラウザの Origin と食い違って Spring が
        # 「別サイトからのリクエスト(CORS)」と誤判定し、PUT/PATCH/POST が 403 になる。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
